{% extends "base.html" %}
{% block content %}

<div style="display:flex; min-height:100vh; background:#f8fafc;">

<!-- SIDEBAR -->
<div style="
width:250px;
background:white;
border-right:1px solid #e5e7eb;
padding:30px 20px;
">

<div style="text-align:center; margin-bottom:35px;">
<img src="{{ url_for('static', filename='logo.png') }}"
style="width:85px;height:85px;object-fit:contain;">

<h2 style="margin-top:12px;font-size:28px;font-weight:800;color:#111827;">
Spendora
</h2>

<p style="font-size:12px;color:#6b7280;letter-spacing:1px;">
Expense Intelligence
</p>
</div>

<a href="/dashboard" style="display:block;padding:14px;margin-bottom:10px;color:#111827;text-decoration:none;font-weight:600;">🏠 Dashboard</a>

<a href="/add_expense" style="display:block;padding:14px;margin-bottom:10px;background:#111827;color:white;border-radius:12px;text-decoration:none;font-weight:600;">➕ Add Expense</a>

<a href="/report" style="display:block;padding:14px;margin-bottom:10px;color:#111827;text-decoration:none;font-weight:600;">📊 Reports</a>

<a href="/logout" style="display:block;padding:14px;color:#dc2626;text-decoration:none;font-weight:600;">🚪 Logout</a>

</div>

<!-- MAIN -->
<div style="flex:1; padding:35px; display:flex; justify-content:center; align-items:flex-start;">

<div style="
width:100%;
max-width:560px;
background:white;
padding:34px;
border-radius:24px;
box-shadow:0 20px 40px rgba(0,0,0,.06);
">

<h1 style="font-size:34px;font-weight:800;color:#111827;margin-bottom:6px;">
Add New Expense
</h1>

<p style="color:#6b7280;margin-bottom:26px;">
Track every spending smartly
</p>

<form method="POST" action="/add_expense">

<label style="display:block;font-weight:600;margin-bottom:8px;color:#374151;">
Category
</label>

<select
name="category"
required
style="
width:100%;
padding:14px;
border:1px solid #d1d5db;
border-radius:14px;
margin-bottom:18px;
background:white;">

<option value="">Select Category</option>
<option>Food</option>
<option>Transport</option>
<option>Shopping</option>
<option>Bills</option>
<option>Health</option>
<option>Entertainment</option>
<option>Education</option>
<option>Travel</option>
<option>Other</option>

</select>

<label style="display:block;font-weight:600;margin-bottom:8px;color:#374151;">
Amount
</label>

<input
type="number"
step="0.01"
min="1"
name="amount"
required
placeholder="Enter amount"
style="
width:100%;
padding:14px;
border:1px solid #d1d5db;
border-radius:14px;
margin-bottom:18px;">

<label style="display:block;font-weight:600;margin-bottom:8px;color:#374151;">
Date
</label>

<input
type="date"
name="date"
required
style="
width:100%;
padding:14px;
border:1px solid #d1d5db;
border-radius:14px;
margin-bottom:24px;">

<button
type="submit"
style="
width:100%;
padding:15px;
background:#111827;
color:white;
border:none;
border-radius:14px;
font-size:15px;
font-weight:700;
cursor:pointer;">
Save Expense
</button>

</form>

<div style="margin-top:18px;text-align:center;">
<a href="/dashboard"
style="color:#111827;text-decoration:none;font-weight:600;">
← Back to Dashboard
</a>
</div>

</div>

</div>

</div>

{% endblock %}
